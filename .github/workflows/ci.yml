name: Top Off CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test engine and package
        run: swift test

      - name: Build iOS app
        run: |
          xcodebuild \
            -project TopOff.xcodeproj \
            -scheme TopOff \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
